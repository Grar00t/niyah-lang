name: Niyah native M0+M1 verification (manual only)

# Manual-only. All acceptance tests run locally; do not launch billed CI on pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out committed sources
        uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          cc --version
          make --version
      - name: Execute offline lexer, parser, morphology and golden tests
        run: make test
      - name: Verify lexer, parser and morphology with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -o "$RUNNER_TEMP/niyah-lexer-test-asan" \
            tests/lexer_test.c src/lexer.c
          "$RUNNER_TEMP/niyah-lexer-test-asan"
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -o "$RUNNER_TEMP/niyah-lexer-recovery-test-asan" \
            tests/lexer_recovery_test.c src/lexer.c
          "$RUNNER_TEMP/niyah-lexer-recovery-test-asan"
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -o "$RUNNER_TEMP/niyah-morph-test-asan" \
            tests/morph_test.c src/morph.c
          "$RUNNER_TEMP/niyah-morph-test-asan"
          cc -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -o "$RUNNER_TEMP/niyah-parser-test-asan" \
            tests/parser_test.c src/parser.c src/lexer.c
          "$RUNNER_TEMP/niyah-parser-test-asan"
